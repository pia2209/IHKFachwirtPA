name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine scheme
        id: scheme
        shell: bash
        run: |
          set -euo pipefail
          scheme="$(xcodebuild -list -json | ruby -e 'require "json"; data = JSON.parse(STDIN.read); puts data["project"]["targets"].first')"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $scheme"

      - name: Build
        env:
          SCHEME: ${{ steps.scheme.outputs.scheme }}
        shell: bash
        run: |
          set -euo pipefail

          device_id="$(xcrun simctl list devices available 2>/dev/null | grep -E 'iPhone .* \(' | head -1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/' || true)"
          if [ -z "$device_id" ]; then
            echo "No iPhone simulator is available on the runner." >&2
            exit 1
          fi

          xcodebuild build \
            -project IHKFachwirtPA.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$device_id" \
            CODE_SIGNING_ALLOWED=NO
